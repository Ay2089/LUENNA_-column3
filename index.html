<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUENNA | ありのまま」で過ごせる服</title>
    <style>
        /* ページ全体のスタイル */
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0; /* ページの背景色 */
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        /* 画像を囲むコンテナのスタイル */
        .lp-container {
            max-width: 1000px; /* LPの最大幅 */
            margin: 0 auto; /* 中央寄せ */
            background-color: #fff; /* コンテンツエリアの背景色 */
            box-shadow: 0 0 10px rgba(0,0,0,0.1); /* 軽い影をつける */
        }

        /* 各画像のスタイル */
        .lp-image {
            width: 100%; /* コンテナの幅に合わせる */
            height: auto; /* 高さは自動調整（アスペクト比を維持） */
            display: block; /* 画像の下に隙間ができないようにする */
        }
    </style>
</head>
<body>

    <div class="lp-container">
        <!-- コンセプト -->
        <img src="image_0.png" alt="LUENNA コンセプトストーリー" class="lp-image">
        
        <!-- こだわり -->
        <img src="image_1.png" alt="LUENNA のこだわり" class="lp-image">
        
        <!-- おすすめ -->
        <img src="image_2.png" alt="LUENNA おすすめアイテム" class="lp-image">
        
        <!-- カラーバリエーション -->
        <img src="image_3.png" alt="LUENNA カラーバリエーション" class="lp-image">
    </div>

</body>
</html>
